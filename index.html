<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stretch">
<meta name="theme-color" content="#15242E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Stretch &amp; Mobility — 70.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F7; --ink:#15242E; --muted:#6B7B85; --card:#FFFFFF; --line:#DDE4E7;
  --acc:#2E7D4F; --acc-soft:#E4F1E9;
  --shadow:0 2px 10px rgba(21,36,46,.07);
  --radius:16px;
  --safe: env(safe-area-inset-bottom, 0px);
}
[data-r="D"]{--acc:#C24E14; --acc-soft:#FBEADF;}
[data-r="A"]{--acc:#2E7D4F; --acc-soft:#E4F1E9;}
[data-r="B"]{--acc:#8A6420; --acc-soft:#F5EEDC;}
[data-r="C"]{--acc:#1273A5; --acc-soft:#E3F0F7;}
[data-r="E"]{--acc:#B03030; --acc-soft:#FBEAEA;}
[data-r="P"]{--acc:#5E4B9E; --acc-soft:#ECE9F6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;
  padding-bottom:calc(50px + var(--safe));-webkit-font-smoothing:antialiased;}
.wrap{max-width:600px;margin:0 auto;padding:0 14px;}
header{padding:22px 0 4px;}
h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:24px;margin:0;letter-spacing:-.2px;}
h1 em{font-style:normal;color:var(--acc);}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px;font-weight:500;}

/* routine picker */
.picker{display:flex;gap:7px;margin:16px 0 14px;overflow-x:auto;padding-bottom:3px;
  scrollbar-width:none;-ms-overflow-style:none;}
.picker::-webkit-scrollbar{display:none;}
.pill{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;
  padding:9px 15px;font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;
  color:var(--muted);cursor:pointer;transition:all .16s;white-space:nowrap;}
.pill .k{display:inline-block;font-size:11px;opacity:.75;margin-right:5px;letter-spacing:.05em;}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:var(--shadow);}
.pill:focus-visible{outline:3px solid var(--acc);outline-offset:2px;}

/* header blurb */
.blurb{background:var(--acc-soft);border-left:3px solid var(--acc);border-radius:0 10px 10px 0;
  padding:10px 13px;font-size:13px;line-height:1.5;margin-bottom:14px;}
.blurb b{font-family:'Archivo',sans-serif;}

/* control bar */
.ctrl{position:sticky;top:6px;z-index:20;background:var(--card);border-radius:var(--radius);
  box-shadow:0 4px 18px rgba(21,36,46,.13);padding:13px 15px;margin-bottom:14px;}
.ctrl-row{display:flex;align-items:center;gap:12px;}
.big-time{font-family:'Archivo',sans-serif;font-weight:800;font-size:38px;line-height:1;
  font-variant-numeric:tabular-nums;min-width:104px;}
.big-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.6px;margin-top:4px;min-height:14px;}
.btns{margin-left:auto;display:flex;gap:7px;}
.btn{border:none;cursor:pointer;font-family:'Archivo',sans-serif;font-weight:700;font-size:15px;
  border-radius:999px;padding:12px 20px;transition:transform .1s ease,background .15s;}
.btn:active{transform:scale(.96);}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
.btn-go{background:var(--acc);color:#fff;}
.btn-go.paused{background:var(--ink);}
.btn-reset{background:#EEF1F3;color:var(--ink);font-size:13px;padding:12px 13px;}
.dots{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap;}
.dot-step{width:11px;height:11px;border-radius:50%;background:#E3E8EA;transition:all .25s;}
.dot-step.done{background:var(--acc);opacity:.5;}
.dot-step.now{background:var(--acc);opacity:1;animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.togs{display:flex;gap:6px;margin-top:11px;}
.tog{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;
  padding:8px 3px;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:12px;
  cursor:pointer;transition:all .15s;}
.tog.on{border-color:var(--ink);color:var(--ink);background:#F2F5F6;}
.tog:focus-visible{outline:3px solid var(--acc);outline-offset:2px;}

/* exercise cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:10px;overflow:hidden;border-left:6px solid var(--acc);cursor:pointer;transition:box-shadow .2s;}
.card.key{border-left-width:6px;}
.card.active{box-shadow:0 0 0 3px var(--acc),0 6px 20px rgba(21,36,46,.18);}
.card-top{display:flex;align-items:center;gap:11px;padding:11px 13px;}
.fig{width:60px;height:48px;flex:0 0 60px;color:var(--acc);}
.fig svg{width:100%;height:100%;}
.card-info{flex:1;min-width:0;}
.card-name{font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;line-height:1.2;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tick{display:none;color:var(--acc);font-size:16px;}
.card.done .tick{display:inline;}
.chip{display:inline-block;margin-top:3px;font-size:12px;font-weight:600;padding:2px 9px;
  border-radius:999px;background:var(--acc-soft);color:var(--acc);}
.keytag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  background:var(--ink);color:#fff;padding:2px 7px;border-radius:4px;}
.phase{font-size:12.5px;font-weight:600;color:var(--acc);margin-top:3px;min-height:0;}
.ring-wrap{position:relative;width:58px;height:58px;flex:0 0 58px;}
.ring-btn{position:absolute;inset:0;border:none;border-radius:50%;background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:'Archivo',sans-serif;font-weight:800;font-size:19px;color:var(--ink);}
.ring-btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px;}
.ring-btn .play{width:0;height:0;border-style:solid;border-width:10px 0 10px 16px;
  border-color:transparent transparent transparent currentColor;margin-left:4px;opacity:.55;}
.card.active .ring-btn .play{display:none;}
.ring-num{display:none;font-variant-numeric:tabular-nums;}
.card.active .ring-num{display:block;}
svg.ring{position:absolute;inset:0;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:#EDF0F1;stroke-width:4.5;}
.ring-fg{fill:none;stroke:var(--acc);stroke-width:4.5;stroke-linecap:round;
  stroke-dasharray:150.8;stroke-dashoffset:150.8;transition:stroke-dashoffset .2s linear;}
.card.ready .ring-fg{stroke:#C9A227;}
.how{display:none;padding:0 14px 13px;font-size:13.5px;line-height:1.6;color:#3E4E58;}
.card.open .how{display:block;}
.how .cue{display:block;margin-top:7px;font-weight:600;color:var(--acc);font-size:12.5px;}

/* progress */
.pcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:11px;}
.ptitle{font-family:'Archivo',sans-serif;font-weight:700;font-size:15px;margin:0 0 11px;}
.stat-row{display:flex;gap:8px;text-align:center;}
.stat{flex:1;}
.stat .n{font-family:'Archivo',sans-serif;font-weight:800;font-size:30px;line-height:1.1;}
.stat .l{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);padding-bottom:2px;}
.gd{aspect-ratio:1/1;border-radius:8px;background:#EEF1F3;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;color:var(--muted);}
.gd.hit{background:#2E7D4F;color:#fff;}
.gd.today{box-shadow:0 0 0 2px #C24E14;}
.hist{list-style:none;margin:0;padding:0;}
.hist li{display:flex;justify-content:space-between;gap:9px;padding:8px 0;
  border-bottom:1px solid #F0F2F4;font-weight:600;font-size:14px;}
.hist li:last-child{border-bottom:none;}
.hist .when{color:var(--muted);font-weight:500;white-space:nowrap;font-size:13px;}
.empty{color:var(--muted);text-align:center;font-weight:500;padding:8px 0;font-size:14px;}
.wipe{margin-top:12px;width:100%;border:1.5px solid var(--line);background:#fff;color:var(--muted);
  border-radius:10px;padding:10px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;}

/* overlay */
#overlay{position:fixed;inset:0;background:rgba(21,36,46,.55);display:none;align-items:center;
  justify-content:center;z-index:60;padding:22px;}
#overlay.show{display:flex;}
.done-box{background:#fff;border-radius:20px;padding:26px 22px;text-align:center;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.done-box h3{font-family:'Archivo',sans-serif;font-size:20px;margin:0 0 8px;}
.done-box p{margin:0 0 16px;color:#3E4E58;font-size:14.5px;line-height:1.55;}
.done-box .btn{background:var(--ink);color:#fff;width:100%;}
footer{text-align:center;color:var(--muted);font-size:11.5px;padding:20px 0 8px;line-height:1.6;}
</style>
</head>
<body data-r="D">
<div class="wrap">
<header>
  <h1>Stretch <em>&amp;</em> Mobility</h1>
  <p class="sub">Five routines · IRONMAN 70.3 Bolton, 6 June 2027</p>
</header>

<div class="picker" id="picker"></div>
<div class="blurb" id="blurb"></div>

<div class="ctrl">
  <div class="ctrl-row">
    <div>
      <div class="big-time" id="bigTime">0:00</div>
      <div class="big-label" id="bigLabel">Ready</div>
    </div>
    <div class="btns">
      <button class="btn btn-reset" id="resetBtn">Reset</button>
      <button class="btn btn-go" id="goBtn">Start</button>
    </div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="togs">
    <button class="tog on" id="togVoice">🔊 Voice</button>
    <button class="tog on" id="togFx">🔔 Beeps</button>
    <button class="tog on" id="togWake">💡 Screen on</button>
  </div>
</div>

<div id="cards"></div>
<div id="progress" style="display:none"></div>

<footer>
  Tap a card to read the technique. Tap the ring to run one exercise on its own.<br>
  Hold to tension, never to pain. Breathe out as you sink in.<br>
  <a href="plan.html" style="color:#2E7D4F;font-weight:600;text-decoration:none">View the winter training plan →</a>
</footer>
</div>

<div id="overlay"><div class="done-box">
  <h3 id="doneTitle">Done</h3>
  <p id="doneMsg"></p>
  <button class="btn" id="doneClose">Close</button>
</div></div>

/* ---------- routines ---------- */
const R=[
{k:"D",name:"Pre-run",full:"Routine D — Pre-run dynamic",mins:"5 min",
 blurb:"<b>Before every single run.</b> Never static stretch cold muscles — this wakes the hips and calves up instead. Skipping it is the fastest route to a tight-calf injury.",
 ex:[
 {n:"Ankle pogos",i:"pogo",t:"30 sec",ph:[["Small fast bounces",30]],
  how:"Feet together, stay on the balls of your feet and bounce lightly — like skipping without a rope. Knees stay almost straight and springy, contact with the floor is quick and quiet.",

 {n:"Walking lunges",i:"lunge",t:"40 sec",ph:[["Walk and lunge",40]],

 {n:"High knees + heel flicks",i:"knees",t:"40 sec",ph:[["20m each, easy",40]],

 {n:"Strides",i:"stride",t:"2 × 20 sec",ph:[["Stride 1",20],["Walk back",25],["Stride 2",20]],

{k:"A",name:"Post-run",full:"Routine A — Post-run stretch",mins:"9 min",

/* ---------- state ---------- */
const RING_C=150.8;
let cur=0, run=null, timerId=null, lastWholeSec=null, wakeLock=null;
const doneSets=R.map(()=>new Set());
const opts={voice:true,fx:true,wake:true};
const $=s=>document.querySelector(s);
const pickerEl=$("#picker"), blurbEl=$("#blurb"), cardsEl=$("#cards"), progEl=$("#progress"),
      dotsEl=$("#dots"), bigTime=$("#bigTime"), bigLabel=$("#bigLabel"),
      goBtn=$("#goBtn"), resetBtn=$("#resetBtn");
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const total=r=>r.ex.reduce((t,c)=>t+c.ph.reduce((a,p)=>a+p[1],0),0);

/* ---------- audio ---------- */
let AC=null;
const audio=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;};
function beep(f,d,w,v){const ac=audio();if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,ac.currentTime+w);
  g.gain.exponentialRampToValueAtTime(v||0.22,ac.currentTime+w+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+w+d);
  o.connect(g).connect(ac.destination);o.start(ac.currentTime+w);o.stop(ac.currentTime+w+d+0.05);}
const tickBeep=()=>beep(880,0.1,0,0.14);
const phaseBeep=()=>beep(620,0.22,0,0.24);
const doneBeep=()=>{beep(523,0.15,0);beep(698,0.28,0.15);};
const finBeep=()=>{beep(523,0.14,0);beep(659,0.14,0.14);beep(784,0.34,0.28,0.26);};

/* ---------- voice ---------- */
function say(t,interrupt=true){
  if(!opts.voice||!("speechSynthesis"in window))return;
  try{ if(interrupt)speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    const vs=speechSynthesis.getVoices();
    const v=vs.find(x=>x.lang==="en-GB")||vs.find(x=>x.lang&&x.lang.indexOf("en")===0);
    if(v)u.voice=v; u.rate=0.98;u.pitch=1;u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
if("speechSynthesis"in window)speechSynthesis.getVoices();

/* ---------- wake lock ---------- */
async function lockScreen(){
  if(!opts.wake||!("wakeLock"in navigator))return;
  try{ wakeLock=await navigator.wakeLock.request("screen"); }catch(e){}
}
function unlockScreen(){ try{ if(wakeLock){wakeLock.release();wakeLock=null;} }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&run&&!run.paused)lockScreen(); });

/* ---------- render ---------- */
function renderPicker(){
  pickerEl.innerHTML=R.map((r,i)=>
    `<button class="pill${i===cur?" on":""}" data-i="${i}">${r.k!=="P"?`<span class="k">${r.k}</span>`:""}${r.name}</button>`
  ).join("");
  pickerEl.querySelectorAll(".pill").forEach(b=>b.onclick=()=>{switchTo(+b.dataset.i);});
}
function renderCards(){
  const r=R[cur];
  cardsEl.innerHTML=r.ex.map((c,i)=>`
   <div class="card${c.key?" key":""}" data-i="${i}">
     <div class="card-top">
       <div class="fig">${ICONS[c.i]||""}</div>
       <div class="card-info">
         <div class="card-name">${c.n}<span class="tick">✓</span>${c.key?'<span class="keytag">key</span>':""}</div>
         <span class="chip">${c.t}</span>
         <div class="phase"></div>
       </div>
       <div class="ring-wrap">
         <svg class="ring" viewBox="0 0 58 58"><circle class="ring-bg" cx="29" cy="29" r="24"/>
         <circle class="ring-fg" cx="29" cy="29" r="24"/></svg>
         <button class="ring-btn" aria-label="Run ${c.n}"><span class="play"></span><span class="ring-num"></span></button>
       </div>
     </div>
     <div class="how">${c.how}<span class="cue">▸ ${c.cue}</span></div>
   </div>`).join("");
  cardsEl.querySelectorAll(".card").forEach((el,i)=>{
    el.onclick=e=>{ if(e.target.closest(".ring-btn"))return; el.classList.toggle("open"); };
    el.querySelector(".ring-btn").onclick=e=>{e.stopPropagation();startSingle(i);};
  });
  dotsEl.innerHTML=r.ex.map(()=>`<span class="dot-step"></span>`).join("");
  syncDone();
}
function switchTo(i){
  clearRun(); cur=i;
  const r=R[cur];
  document.body.dataset.r=r.k;
  renderPicker();
  if(r.k==="P"){
    cardsEl.style.display="none"; progEl.style.display="block";
    document.querySelector(".ctrl").style.display="none";
    blurbEl.style.display="none";
    renderProgress();
  }else{
    cardsEl.style.display="block"; progEl.style.display="none";
    document.querySelector(".ctrl").style.display="block";
    blurbEl.style.display="block"; blurbEl.innerHTML=r.blurb;
    renderCards();
    bigTime.textContent=fmt(total(r)); bigLabel.textContent=r.full+" · "+r.mins;
    goBtn.textContent="Start"; goBtn.classList.remove("paused");
  }
}
function syncDone(){
  const d=doneSets[cur];
  cardsEl.querySelectorAll(".card").forEach((el,i)=>el.classList.toggle("done",d.has(i)));
  dotsEl.querySelectorAll(".dot-step").forEach((el,i)=>{
    el.classList.toggle("done",d.has(i));
    el.classList.toggle("now",!!run&&run.card===i);
  });
}

/* ---------- engine ---------- */
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }
function clearRun(){
  stopTimer(); run=null; lastWholeSec=null; unlockScreen();
  if("speechSynthesis"in window)speechSynthesis.cancel();
  cardsEl.querySelectorAll(".card").forEach(el=>{
    el.classList.remove("active","ready");
    el.querySelector(".phase").textContent="";
    el.querySelector(".ring-fg").style.strokeDashoffset=RING_C;
  });
  syncDone();
}
function startRoutine(){
  clearRun(); audio(); lockScreen();
  doneSets[cur]=new Set();
  run={type:"routine",card:0,phase:0,remain:R[cur].ex[0].ph[0][1]*1000,paused:false,lastT:performance.now()};
  goBtn.textContent="Pause"; goBtn.classList.remove("paused");
  beginPhase("first"); timerId=setInterval(tick,150);
}
function startSingle(i){
  clearRun(); audio(); lockScreen();
  run={type:"single",card:i,phase:0,remain:R[cur].ex[i].ph[0][1]*1000,paused:false,lastT:performance.now()};
  goBtn.textContent="Pause"; goBtn.classList.remove("paused");
  beginPhase("single"); timerId=setInterval(tick,150);
}
function announce(mode,c,ph){
  const nm=c.n.replace(/—/g,","), secs=ph[1];
  const side=/^(left|right)/i.test(ph[0]);
  if(mode==="first") say("Starting "+R[cur].name+". First: "+nm+". "+ph[0]+", "+secs+" seconds.");
  else if(mode==="single") say(nm+". "+ph[0]+", "+secs+" seconds.");
  else if(mode==="phase"){
    if(/^rest/i.test(ph[0])) say("Rest. "+secs+" seconds.");
    else if(/^right/i.test(ph[0])) say("Swap sides. Right, "+secs+" seconds.");
    else say(ph[0]+", "+secs+" seconds.");
  }
  else if(mode==="next") say("Next: "+nm+". "+ph[0]+", "+secs+" seconds.");
}
function beginPhase(mode){
  const c=R[cur].ex[run.card], ph=c.ph[run.phase];
  const needsReady = mode==="first"||mode==="single"||mode==="next"||(mode==="phase"&&/^right/i.test(ph[0]));
  run.ready = needsReady?4000:0;
  lastWholeSec = needsReady?5:Math.ceil(run.remain/1000)+1;
  announce(mode,c,ph);
  cardsEl.querySelectorAll(".card").forEach((el,i)=>{
    const on=i===run.card;
    el.classList.toggle("active",on);
    el.classList.toggle("ready",on&&needsReady);
    el.querySelector(".phase").textContent=on?(needsReady?"Get into position…":ph[0]):"";
    if(!on)el.querySelector(".ring-fg").style.strokeDashoffset=RING_C;
  });
  syncDone();
  cardsEl.children[run.card].scrollIntoView({behavior:"smooth",block:"center"});
  paint();
}
function tick(){
  if(!run||run.paused)return;
  const now=performance.now(), dt=now-run.lastT; run.lastT=now;
  const c=R[cur].ex[run.card], ph=c.ph[run.phase];
  if(run.ready>0){
    run.ready-=dt;
    const rs=Math.ceil(run.ready/1000);
    if(rs<lastWholeSec){lastWholeSec=rs; if(rs>0&&rs<=3&&opts.fx)tickBeep();}
    if(run.ready<=0){
      run.ready=0; lastWholeSec=Math.ceil(run.remain/1000)+1;
      if(opts.fx)phaseBeep(); say("Go.");
      const el=cardsEl.children[run.card];
      el.classList.remove("ready");
      el.querySelector(".phase").textContent=ph[0];
    }
    paint(); return;
  }
  run.remain-=dt;
  const rs=Math.ceil(run.remain/1000);
  if(rs<lastWholeSec){ lastWholeSec=rs; if(rs>0&&rs<=3&&opts.fx)tickBeep(); }
  if(run.remain<=0){
    if(run.phase<c.ph.length-1){
      run.phase++; run.remain=c.ph[run.phase][1]*1000;
      if(opts.fx)phaseBeep();
      beginPhase("phase"); return;
    }
    doneSets[cur].add(run.card);
    if(run.type==="single"){ if(opts.fx)doneBeep(); say("Done."); clearRun(); resetDisplay(); return; }
    if(run.card<R[cur].ex.length-1){
      run.card++; run.phase=0; run.remain=R[cur].ex[run.card].ph[0][1]*1000;
      if(opts.fx)doneBeep();
      beginPhase("next"); return;
    }
    finish(); return;
  }
  paint();
}
function paint(){
  const c=R[cur].ex[run.card], ph=c.ph[run.phase];
  const showReady=run.ready>0;
  const ms=showReady?run.ready:run.remain;
  const secs=Math.max(0,Math.ceil(ms/1000));
  bigTime.textContent=fmt(ms/1000);
  bigLabel.textContent=showReady?"Get ready":(c.n+" · "+ph[0]);
  const el=cardsEl.children[run.card];
  const frac=showReady?(1-run.ready/4000):(1-run.remain/(ph[1]*1000));
  el.querySelector(".ring-fg").style.strokeDashoffset=RING_C*(1-Math.min(1,Math.max(0,frac)));
  el.querySelector(".ring-num").textContent=secs;
}
function resetDisplay(){
  bigTime.textContent=fmt(total(R[cur])); bigLabel.textContent=R[cur].full+" · "+R[cur].mins;
  goBtn.textContent="Start"; goBtn.classList.remove("paused");
}
function finish(){
  if(opts.fx)finBeep();
  const r=R[cur];
  say("Routine complete. Well done.");
  clearRun(); resetDisplay();
  logSession(r.k,r.name);
  $("#doneTitle").textContent=r.name+" complete";
  $("#doneMsg").textContent=FINISH[r.k]||"Nicely done.";
  $("#overlay").classList.add("show");
}
const FINISH={
 D:"Warm, loose and ready. Now go and run — easy pace, conversational the whole way.",
 A:"That's the run properly finished. Ten minutes now saves weeks later.",
 B:"Twenty minutes of honest work on the tightest part of you. Sleep will be better for it.",
 C:"Rolled out and released. Follow it with a glass of water and an early night.",
 E:"Eccentric loading done. This is the work that keeps you running through the whole block."
};
$("#doneClose").onclick=()=>$("#overlay").classList.remove("show");

goBtn.onclick=()=>{
  audio();
  if(!run){ startRoutine(); return; }
  run.paused=!run.paused;
  if(run.paused){ goBtn.textContent="Resume"; goBtn.classList.add("paused"); bigLabel.textContent="Paused"; unlockScreen();
    if("speechSynthesis"in window)speechSynthesis.cancel(); }
  else { run.lastT=performance.now(); goBtn.textContent="Pause"; goBtn.classList.remove("paused"); lockScreen(); paint(); }
};
resetBtn.onclick=()=>{ clearRun(); doneSets[cur]=new Set(); syncDone(); resetDisplay(); };
function togWire(id,key,el){ el.onclick=()=>{ opts[key]=!opts[key]; el.classList.toggle("on",opts[key]);
  if(key==="voice"&&!opts.voice&&"speechSynthesis"in window)speechSynthesis.cancel();
  if(key==="wake"){ opts.wake?lockScreen():unlockScreen(); } }; }
togWire("togVoice","voice",$("#togVoice"));
togWire("togFx","fx",$("#togFx"));
togWire("togWake","wake",$("#togWake"));

/* ---------- progress log ---------- */
const KEY="nick-stretch-log";
let memLog=[];
async function loadLog(){
  if(window.storage){ let r=null; try{ r=await window.storage.get(KEY); }catch(e){ r=null; }
    if(r&&r.value){ try{ memLog=JSON.parse(r.value); return; }catch(e){} } }
  try{ const v=localStorage.getItem(KEY); memLog=v?JSON.parse(v):[]; }catch(e){ memLog=[]; }
}
async function saveLog(){
  const s=JSON.stringify(memLog);
  if(window.storage){ try{ await window.storage.set(KEY,s); }catch(e){} }
  try{ localStorage.setItem(KEY,s); }catch(e){}
}
function logSession(k,name){
  memLog.unshift({k,name,t:Date.now()});
  if(memLog.length>200)memLog.length=200;
  saveLog();
}
const dayKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function streak(){
  const days=new Set(memLog.map(e=>dayKey(new Date(e.t))));
  let n=0, d=new Date();
  if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function renderProgress(){
  const days=new Set(memLog.map(e=>dayKey(new Date(e.t))));
  const wk=new Date(); wk.setDate(wk.getDate()-6);
  const last7=memLog.filter(e=>e.t>=wk.setHours(0,0,0,0)).length;
  const cells=[]; const today=dayKey(new Date());
  const start=new Date(); start.setDate(start.getDate()-27);
  const off=(start.getDay()+6)%7; start.setDate(start.getDate()-off);
  for(let i=0;i<35;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const k=dayKey(d), fut=d>new Date();
    cells.push(`<div class="gd${days.has(k)?" hit":""}${k===today?" today":""}" style="${fut?"opacity:.35":""}">${d.getDate()}</div>`);
  }
  const hist=memLog.slice(0,12).map(e=>{
    const d=new Date(e.t);
    const when=d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" · "+
               d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    return `<li><span>${e.name}</span><span class="when">${when}</span></li>`;
  }).join("");
  progEl.innerHTML=`
   <div class="pcard"><div class="stat-row">
     <div class="stat"><div class="n">${streak()}</div><div class="l">Day streak</div></div>
     <div class="stat"><div class="n">${last7}</div><div class="l">This week</div></div>
     <div class="stat"><div class="n">${memLog.length}</div><div class="l">All time</div></div>
   </div></div>
   <div class="pcard"><h3 class="ptitle">Last five weeks</h3>
     <div class="grid7">${["M","T","W","T","F","S","S"].map(d=>`<div class="dow">${d}</div>`).join("")}</div>
     <div class="grid7" style="margin-top:4px">${cells.join("")}</div>
   </div>
   <div class="pcard"><h3 class="ptitle">Recent sessions</h3>
     ${hist?`<ul class="hist">${hist}</ul>`:`<p class="empty">Nothing logged yet — finish a routine and it'll appear here.</p>`}
     <button class="wipe" id="wipeBtn">Clear all history</button>
   </div>`;
  $("#wipeBtn").onclick=()=>{ if(confirm("Clear all logged sessions?")){ memLog=[]; saveLog(); renderProgress(); } };
}

/* ---------- go ---------- */
(async function(){ await loadLog(); renderPicker(); switchTo(0); })();
</script>
